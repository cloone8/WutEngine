[package]
name = "wutengine_log"
description = "Logging implementation for WutEngine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

readme = "README.md"

[features]
# Enables the terminal output logger
terminal_output = []

# Enables the file output logger
file_output = ["dep:dirs"]

[dependencies]
wutengine_sync = { workspace = true }

log = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }

# Optional dependencies
dirs = { workspace = true, optional = true } # Only for filesystem logging

[lints]
workspace = true
