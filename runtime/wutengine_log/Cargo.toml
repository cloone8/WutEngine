[package]
name = "wutengine_log"
description = "Logging implementation for WutEngine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

readme = "README.md"

[features]
# Enables the terminal output logger
terminal_output = ["dep:anstyle"]

# Enables the file output logger
file_output = ["dep:dirs"]

[dependencies]
wutengine_sync = { workspace = true }

log = { workspace = true }
derive_more = { workspace = true, features = ["debug", "error", "from", "display"] }

# Optional dependencies
anstyle = { workspace = true, optional = true } # Only for terminal logging
dirs = { workspace = true, optional = true }    # Only for filesystem logging

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["console"] }
web-time = { workspace = true }

[lints]
workspace = true
