[package]
name = "wutengine"
description = "A modern game engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

readme = "README.md"

[features]
default = ["interactive", "labels"]
interactive = ["dep:winit", "dep:wgpu"] # No-headless
labels = []

[dependencies]
wutengine_log = { workspace = true, features = ["terminal_output", "file_output"] }
wutengine_macro = { workspace = true }
wutengine_sync = { workspace = true }
profiling = { workspace = true }

# Non-headless builds
winit = { workspace = true, features = ["wayland", "x11", "wayland-dlopen", "wayland-csd-adwaita"], optional = true }
wgpu = { workspace = true, features = [
  "dx12",
  "metal",
  "parking_lot",
  "std",
  "vulkan",
  "webgpu",
  "wgsl",
  "fragile-send-sync-non-atomic-wasm",

], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[lints]
workspace = true
