[package]
name = "wutengine"
description = "A modern game engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

readme = "README.md"

[features]
default = ["interactive", "labels"]
interactive = ["dep:winit", "dep:wutengine_renderer"] # No-headless
labels = ["wutengine_renderer?/labels"]

[dependencies]
wutengine_log = { workspace = true }
wutengine_macro = { workspace = true }
wutengine_sync = { workspace = true }
wutengine_math = { workspace = true }
wutengine_executor = { workspace = true }
profiling = { workspace = true }
derive_more = { workspace = true, features = ["debug", "display", "error"] }

# Non-headless builds
winit = { workspace = true, features = ["wayland", "x11", "wayland-dlopen", "wayland-csd-adwaita"], optional = true }
wutengine_renderer = { workspace = true, optional = true }
wgpu = { workspace = true }                                                                                           # Only for the public re-export in `graphics`

# Native-only. Web logs to the browser console instead, and can't write to a terminal or log files
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wutengine_log = { workspace = true, features = ["terminal_output", "file_output"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
web-time = { workspace = true }

[lints]
workspace = true
