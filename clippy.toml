missing-docs-in-crate-items = true
too-many-lines-threshold = 50
check-private-items = true
avoid-breaking-exported-api = false
doc-valid-idents = ["WutEngine", ".."]
allow-unwrap-in-tests = true
absolute-paths-max-segments = 2
disallowed-methods = [
    { path = "std::panic::catch_unwind", reason = "no `catch_unwind`: panics abort" },
    { path = "std::sync::PoisonError::into_inner", reason = "never reach inside a poisoned mutex" },
    { path = "std::sync::Mutex::lock", reason = "use `wutengine_sync`'s `Mutex`: locks can't be poisoned with `panic = \"abort\"`" },
    { path = "std::sync::RwLock::read", reason = "use `wutengine_sync`'s `RwLock`: locks can't be poisoned with `panic = \"abort\"`" },
    { path = "std::sync::RwLock::write", reason = "use `wutengine_sync`'s `RwLock`: locks can't be poisoned with `panic = \"abort\"`" },
]
