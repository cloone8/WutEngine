<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WutEngine demo: {{DEMO_NAME}}</title>

    <script type="module">
        // The glue generated by `wasm-bindgen --target web`. Its default export loads `{{DEMO_NAME}}_bg.wasm`
        // from next to it, then runs the demo's `main`.
        import init from "./{{DEMO_NAME}}.js";

        try {
            await init();
        } catch(e) {
            if(e instanceof Error && e.name == "WutEngineQuit") {
                console.log("WutEngine quit with exit code: " + e.exitCode);
            } else {
                throw e;
            }
        }
    </script>
</head>
<body>
    <p>WutEngine demo <code>{{DEMO_NAME}}</code>. Its output is in the browser console.</p>
</body>
</html>
